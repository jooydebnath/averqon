[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "averqon"
version = "0.1.1"
description = "Averqon: Linux firewall and IDS/IPS platform"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Joy Debnath" }]
keywords = ["firewall", "nftables", "iptables", "ids", "ips", "fail2ban", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Networking :: Firewalls",
  "Topic :: Security",
]
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "sqlalchemy>=2.0",
  "typer>=0.12",
  "pyyaml>=6",
  "pyjwt>=2.8",
  "psutil>=5.9",
  "alembic>=1.13",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
server = ["uvicorn>=0.29"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "pytest-cov", "hypothesis", "httpx>=0.27", "ruff>=0.4", "bandit"]

[project.urls]
Homepage = "https://github.com/jooydebnath/averqon"
Source = "https://github.com/jooydebnath/averqon"
Issues = "https://github.com/jooydebnath/averqon/issues"

[project.scripts]
averqon = "cli.main:app"

[tool.setuptools.packages.find]
include = ["app*", "cli*"]

[tool.setuptools.package-data]
"app.database.migrations" = ["*.mako"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["integration: needs root + network namespaces (never touches host firewall)"]

[tool.ruff]
line-length = 100
target-version = "py312"
